<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Skin AI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="card auth-card">
            <div class="logo text-center mb-4" style="justify-content: center;">
                <i class="fas fa-microscope"></i> Skin AI
            </div>
            
            <div id="loginForm">
                <h2 class="text-center mb-4">Welcome Back</h2>
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="loginEmail" required placeholder="Enter your email">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="loginPassword" required placeholder="Enter your password">
                    </div>
                    <button type="submit" class="btn btn-primary">Sign In</button>
                    <div id="loginError" class="mt-4" style="color: var(--error-color); text-align: center; display: none;"></div>
                </form>
                <div class="text-center mt-4">
                    <span style="color: var(--text-secondary)">New here?</span>
                    <button class="btn btn-secondary" onclick="toggleAuth()" style="margin-top: 0.5rem;">Create Account</button>
                </div>
            </div>

            <div id="signupForm" class="hidden">
                <h2 class="text-center mb-4">Create Account</h2>
                <form onsubmit="handleSignup(event)">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="signupEmail" required placeholder="Enter your email">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="signupPassword" required placeholder="Create a password">
                    </div>
                    <button type="submit" class="btn btn-primary">Sign Up</button>
                     <div id="signupError" class="mt-4" style="color: var(--error-color); text-align: center; display: none;"></div>
                </form>
                <div class="text-center mt-4">
                    <span style="color: var(--text-secondary)">Already have an account?</span>
                    <button class="btn btn-secondary" onclick="toggleAuth()" style="margin-top: 0.5rem;">Sign In</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
